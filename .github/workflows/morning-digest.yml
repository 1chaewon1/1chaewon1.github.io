name: morning-digest

on:
  schedule:
    # KST 08:50 / 09:40 (월~금). 1회차에 아직 안 올라왔으면 2회차가 처리하고, 이미 처리했으면 건너뜀.
    - cron: "50 23 * * 0-4"
    - cron: "40 0 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "오늘자가 아니어도 가장 최근 글 처리"
        type: boolean
        default: false
      list_only:
        description: "네이버 수집 결과만 출력(디버그)"
        type: boolean
        default: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          GOOGLE_DOC_ID: ${{ secrets.GOOGLE_DOC_ID }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          args=""
          if [ "${{ inputs.force }}" = "true" ]; then args="$args --force"; fi
          if [ "${{ inputs.list_only }}" = "true" ]; then args="$args --list"; fi
          python scripts/morning_digest.py $args
